services:
  mongodb:
    image: mongo:7.0
    container_name: note_workspace_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: note_workspace_db
    volumes:
      - mongo_data:/data/db
    networks:
      - workspace_net

  mongo-express:
    image: mongo-express:latest
    container_name: note_workspace_mongo_express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: devuser
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - workspace_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: note_workspace_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://devuser:devpassword@mongodb:27017/note_workspace_db?authSource=admin
      DATABASE_NAME: note_workspace_db
    depends_on:
      - mongodb
    networks:
      - workspace_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: note_workspace_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - workspace_net

volumes:
  mongo_data:

networks:
  workspace_net:
    driver: bridge